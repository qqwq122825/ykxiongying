# ============================================================
# 宝塔面板 Nginx 完整站点配置 (端口 8888 - 前端独立端口)
# 适用: 前端页面用 8888 端口单独访问
# ★ 重要: 把 /www/wwwroot/cs 替换为你实际的项目根目录
# ============================================================

server {
    listen 8888;
    server_name _;
    index index.html;
    root /www/wwwroot/cs/public;

    # 前端 SPA 路由 (React BrowserRouter)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 代理 -> 交给本机 80 端口处理 ThinkPHP 重写（同时支持 /api/ 和旧版前端硬编码的 /spi/）
    location ~ ^/(api|spi)/ {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # WebSocket 代理 (面板 WebSocket 面板 -> 8889)
    location ~ ^/ws/ {
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # APK 文件下载
    location /apk_output/ {
        alias /www/wwwroot/cs/runtime/apk_output/;
    }

    location ~ /\. { deny all; }
    access_log  /www/wwwlogs/cs_frontend.log;
    error_log   /www/wwwlogs/cs_frontend.error.log;
}
