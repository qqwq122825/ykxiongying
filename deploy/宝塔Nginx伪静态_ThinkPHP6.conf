# ============================================================
# 星辰 / ThinkPHP 6：宝塔 Nginx「伪静态」完整规则
# 粘贴位置：宝塔 → 网站 → yk.91dms.com → 设置 → 伪静态
#
# 本文件包含：
#   1. /ws/ WebSocket 反向代理
#   2. /apk_output/ APK 下载目录
#   3. /install 与 /install/ 安装向导短地址
#   4. 旧版 APK 的 /s/bn/native 联通探测兼容
#   5. ThinkPHP 统一入口重写
#
# 不要把本文件粘贴到“配置文件”中替换整个 server 块；
# 也不要同时选择宝塔内置 ThinkPHP 模板。
# ============================================================

# WebSocket 反代；仅对当前站点生效。
location /ws/ {
    proxy_pass http://127.0.0.1:8889;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}

# APK 输出目录；文件位于项目 runtime，不在 public 中。
location /apk_output/ {
    alias /www/wwwroot/yk/runtime/apk_output/;
}

# 安装向导短地址；两种写法都进入 public/install.php。
location = /install {
    rewrite ^ /install.php last;
}
location = /install/ {
    rewrite ^ /install.php last;
}

# 旧版 APK 联通探测兼容；当前后端无需为它创建控制器。
location = /s/bn/native {
    default_type application/octet-stream;
    return 204;
}

# ThinkPHP 统一入口。
# /api/* 和 /spi/* 已由项目路由注册，不需要再分别写 location。
location / {
    if (!-e $request_filename) {
        rewrite ^(.*)$ /index.php?s=$1 last;
        break;
    }
}
