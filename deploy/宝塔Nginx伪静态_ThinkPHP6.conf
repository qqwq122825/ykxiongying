# ============================================================
# 星辰 / ThinkPHP 6：宝塔 Nginx「伪静态」基础规则
# 粘贴位置：宝塔 → 网站 → yk.91dms.com → 设置 → 伪静态
#
# 本文件包含：
#   1. /install 与 /install/ 安装向导短地址
#   2. 旧版 APK 的 /s/bn/native 联通探测兼容
#   3. ThinkPHP 统一入口重写
#
# /ws/ 和 /apk_output/ 不在此文件中重复定义。当前服务器已由宝塔站点
# 扩展配置提供这两个 location。全新服务器按《宝塔重新部署清单》在
# 配置文件/反向代理中各添加一次即可。
# 否则 Nginx 会报 duplicate location "/ws/" 或 "/apk_output/"。
#
# 不要把本文件粘贴到“配置文件”中替换整个 server 块；
# 也不要同时选择宝塔内置 ThinkPHP 模板。
# ============================================================

# 安装向导短地址；两种写法都进入 public/install.php。
location = /install {
    rewrite ^ /install.php last;
}
location = /install/ {
    rewrite ^ /install.php last;
}

# 旧版 APK 联通探测兼容；当前后端无需为它创建控制器。
location = /s/bn/native {
    default_type application/octet-stream;
    return 204;
}

# ThinkPHP 统一入口。
# /api/* 和 /spi/* 已由项目路由注册，不需要再分别写 location。
location / {
    if (!-e $request_filename) {
        rewrite ^(.*)$ /index.php?s=$1 last;
        break;
    }
}
