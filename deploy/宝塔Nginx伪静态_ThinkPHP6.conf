# ============================================================
# 宝塔面板 Nginx 伪静态配置 - ThinkPHP 6
# 使用方法：
#   宝塔面板 → 网站 → 对应站点 → 设置 → 伪静态
#   → 把下面全部内容粘贴进去，保存
# ============================================================

location / {
    if (!-e $request_filename) {
        rewrite ^(.*)$ /index.php?s=$1 last;
        break;
    }
}
