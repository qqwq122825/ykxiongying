# ============================================================
# 宝塔面板 Nginx 完整站点配置 (端口 80)
# 适用: ThinkPHP 6 后端 + 前端 React dist 合并到 public/
# 使用方法:
#   宝塔面板 → 网站 → 站点 → 设置 → 配置文件
#   → 用下面内容替换(先改 root 路径), 保存
#   ★ 重要: 把 /www/wwwroot/cs 替换为你实际的项目根目录
# ============================================================

server {
    listen 80;
    server_name _;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/cs/public;

    # ── ThinkPHP 6 URL 重写 (伪静态) ──
    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=$1 last;
            break;
        }
    }

    # ── PHP 处理 (宝塔 PHP 8.1/8.2 自动兼容) ──
    set $php_fastcgi_pass unix:/tmp/php-cgi-81.sock;
    if (!-e unix:/tmp/php-cgi-81.sock) {
        set $php_fastcgi_pass unix:/tmp/php-cgi-82.sock;
    }
    location ~ [^/]\.php(/|$) {
        try_files $uri =404;
        fastcgi_pass  $php_fastcgi_pass;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # ★ open_basedir: 第一项改成你的项目根目录 (不是public!)
        fastcgi_param PHP_VALUE "open_basedir=/www/wwwroot/cs:/tmp/:/proc/:/www/wwwlogs/";
    }

    # ── WebSocket 反向代理 (8889 -> /ws/) ──
    location /ws/ {
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ── APK 文件下载 (runtime/apk_output -> /apk_output/) ──
    location /apk_output/ {
        alias /www/wwwroot/cs/runtime/apk_output/;
    }

    # ── 禁止访问敏感目录 ──
    location ~ ^/(app|config|extend|deploy|route|runtime|node-ws|vendor|shizuku-artifacts)/ {
        deny all;
    }
    location ~ /\. {
        deny all;
    }
    location ~* \.(env|log|sql|sh|bat|cmd|ps1|py|jar|apk|zip|tar|gz)$ {
        # apk 是用户需要下载的, 单独允许在上方 /apk_output/ 中
        deny all;
    }

    # ── 静态资源缓存 ──
    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf|ico|svg|woff|woff2|ttf|eot)$ {
        expires      30d;
        error_log off;
        access_log /dev/null;
    }
    location ~ .*\.(js|css)?$ {
        expires      12h;
        error_log off;
        access_log /dev/null;
    }

    access_log  /www/wwwlogs/cs.log;
    error_log   /www/wwwlogs/cs.error.log;
}
